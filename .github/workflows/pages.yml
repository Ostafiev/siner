# Сборка статики и публикация на GitHub Pages при каждом пуше в main.
#
# Один раз перед первым запуском:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# BASE_PATH должен совпадать с именем репозитория: сайт живёт по адресу
# https://<логин>.github.io/<имя-репозитория>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_PATH: /sinnergems
  NEXT_PUBLIC_BASE_PATH: /sinnergems

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: STATIC_EXPORT=1 npm run build

      # без этого файла GitHub Pages игнорирует папку _next
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
